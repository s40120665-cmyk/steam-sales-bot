name: Steam Sales Bot

on:
  schedule:
    # Запуск каждый день в 15:00 UTC (это ровно 18:00 по МСК)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Даем право записывать index.html на GitHub
    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v3

    - name: Устанавливаем Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Устанавливаем библиотеки
      run: pip install requests

    - name: Запускаем бота
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: python main.py

    - name: Публикуем сайт на GitHub
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "🌐 Обновление сайта скидок" && git push)
