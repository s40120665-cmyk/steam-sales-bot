name: Steam Sales Bot

on:
  schedule:
    - cron: '*/30 * * * *' # Запуск каждые 30 минут автоматически
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Клонируем репозиторий
      uses: actions/checkout@v3

    - name: Устанавливаем Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Устанавливаем библиотеки
      run: pip install requests

    - name: Запускаем бота
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: python main.py

    - name: Сохраняем изменения в базу данных GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add posted_games.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Обновление базы данных скидок" && git push)
